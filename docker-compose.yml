services:
  db:
    image: postgres:16
    container_name: cuentasclaras-postgres
    ports:
      - '4000:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1144066482
      POSTGRES_DB: cuentasclaras_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
